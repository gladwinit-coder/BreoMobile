<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="BreoMobile — Premium Apple devices at unbeatable prices. iPhone, MacBook, iPad, Apple Watch. WhatsApp us to order.">
<title>BreoMobile — Premium Apple Devices</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f0f0f5;--white:#ffffff;--surface:#f8f8fc;
  --text:#1a1a2e;--muted:#6b6b80;--muted2:#a0a0b0;
  --border:#e8e8f0;--border2:#d0d0e0;
  --green:#34C759;--wa:#25D366;--wa-dark:#128C7E;
  --blue:#0A84FF;--red:#FF3B30;--orange:#FF9500;
  --nav-h:64px;--cat-h:50px;
  --radius:14px;--shadow:0 2px 16px rgba(0,0,0,.08);--shadow-lg:0 8px 40px rgba(0,0,0,.14);
}

html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;}
img,video{display:block;}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}

/* ── HEADER ────────────────────────────────── */
.site-header{
  position:sticky;top:0;z-index:300;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
}
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:0 20px;height:var(--nav-h);max-width:1280px;margin:0 auto;
}
.logo{
  font-size:20px;font-weight:800;color:var(--text);white-space:nowrap;
  flex-shrink:0;
}
.logo span{color:var(--green);}

.search-wrap{
  flex:1;max-width:540px;position:relative;
}
.search-wrap input{
  width:100%;background:var(--bg);border:1.5px solid var(--border2);
  border-radius:24px;padding:10px 18px 10px 42px;
  font-size:14px;color:var(--text);outline:none;transition:border-color .2s;
}
.search-wrap input:focus{border-color:var(--green);background:#fff;}
.search-wrap input::placeholder{color:var(--muted2);}
.search-icon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:16px;pointer-events:none;
}

.header-wa{
  display:flex;align-items:center;gap:8px;
  background:var(--wa);color:#fff;
  border:none;border-radius:24px;padding:10px 18px;
  font-size:13px;font-weight:700;white-space:nowrap;
  transition:background .15s;flex-shrink:0;
}
.header-wa:hover{background:var(--wa-dark);}
.header-wa svg{width:18px;height:18px;fill:#fff;flex-shrink:0;}

/* category bar */
.cat-bar{
  border-top:1px solid var(--border);overflow-x:auto;scrollbar-width:none;
  background:rgba(255,255,255,.95);
}
.cat-bar::-webkit-scrollbar{display:none;}
.cat-bar-inner{
  display:flex;gap:6px;padding:8px 20px;
  max-width:1280px;margin:0 auto;
}
.cat-pill{
  flex-shrink:0;background:none;border:1.5px solid var(--border2);
  border-radius:20px;padding:6px 14px;font-size:13px;font-weight:600;
  color:var(--muted);transition:all .18s;
}
.cat-pill.active,.cat-pill:hover{
  background:var(--green);border-color:var(--green);color:#fff;
}

/* ── HERO ───────────────────────────────────── */
.hero{
  background:linear-gradient(135deg,#0a0a14 0%,#151520 50%,#0d1a2a 100%);
  padding:0;overflow:hidden;position:relative;
}
.hero-slides{display:flex;transition:transform .5s ease;height:320px;}
@media(min-width:700px){.hero-slides{height:420px;}}
.hero-slide{
  flex-shrink:0;width:100%;position:relative;
  display:flex;align-items:center;
}
.hero-video{width:100%;height:100%;object-fit:cover;opacity:.7;}
.hero-static{
  width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 24px;
}
.hero-static h1{
  font-size:clamp(24px,5vw,48px);font-weight:800;color:#fff;line-height:1.15;
  margin-bottom:12px;
}
.hero-static h1 span{color:var(--green);}
.hero-static p{color:rgba(255,255,255,.65);font-size:clamp(14px,2.5vw,18px);max-width:500px;margin-bottom:24px;}
.hero-cta{
  background:var(--wa);color:#fff;border:none;border-radius:28px;
  padding:14px 28px;font-size:15px;font-weight:700;display:inline-flex;
  align-items:center;gap:8px;transition:opacity .15s;
}
.hero-cta:hover{opacity:.88;}
.hero-overlay{
  position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,.7) 0%,rgba(0,0,0,.2) 60%,transparent 100%);
  display:flex;align-items:center;padding:0 48px;
}
.hero-overlay-text h2{font-size:clamp(20px,4vw,36px);font-weight:800;color:#fff;margin-bottom:8px;line-height:1.2;}
.hero-overlay-text p{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:16px;}
.hero-overlay-price{font-size:clamp(18px,3vw,28px);font-weight:800;color:var(--green);margin-bottom:16px;}

.hero-dots{
  position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
  display:flex;gap:6px;z-index:2;
}
.hero-dot{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.4);transition:all .3s;border:none;padding:0;}
.hero-dot.active{width:20px;background:#fff;}

/* ── SECTION WRAPPER ───────────────────────── */
.section{max-width:1280px;margin:0 auto;padding:32px 16px 8px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.section-title{font-size:20px;font-weight:800;color:var(--text);}
.section-title span{color:var(--green);}
.see-all{font-size:13px;font-weight:600;color:var(--blue);}

/* ── OFFERS SCROLL ─────────────────────────── */
.offers-scroll{
  display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;
}
.offers-scroll::-webkit-scrollbar{display:none;}

.offer-card{
  flex-shrink:0;width:200px;background:var(--white);border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);
  transition:transform .2s,box-shadow .2s;cursor:pointer;
}
.offer-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}
.offer-card-img{
  height:140px;background:linear-gradient(135deg,#1a1a2e,#2d2d44);
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:40px;
}
.offer-card-img video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.85;}
.offer-badge{
  position:absolute;top:8px;left:8px;
  background:var(--red);color:#fff;font-size:10px;font-weight:800;
  padding:3px 7px;border-radius:5px;z-index:1;
}
.offer-card-body{padding:12px;}
.offer-card-name{font-size:13px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.offer-card-price{font-size:15px;font-weight:800;color:var(--green);}
.offer-card-old{font-size:11px;color:var(--muted2);text-decoration:line-through;}

/* ── PRODUCT GRID ──────────────────────────── */
.products-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
  gap:14px;
}
@media(min-width:480px){.products-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));}}
@media(min-width:900px){.products-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));}}

.prod-card{
  background:var(--white);border-radius:var(--radius);border:1px solid var(--border);
  overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;
  cursor:pointer;display:flex;flex-direction:column;
}
.prod-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);}

.prod-img{
  aspect-ratio:1;background:linear-gradient(135deg,#f0f0f8,#e8e8f4);
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:52px;
}
.prod-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.cat-badge{
  position:absolute;top:8px;left:8px;
  background:rgba(0,0,0,.55);color:#fff;
  font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px;
  backdrop-filter:blur(4px);
}
.sale-badge{
  position:absolute;top:8px;right:8px;
  background:var(--red);color:#fff;
  font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px;
}
.stock-out-overlay{
  position:absolute;inset:0;background:rgba(0,0,0,.5);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:13px;font-weight:700;
}

.prod-body{padding:12px;flex:1;display:flex;flex-direction:column;}
.prod-name{font-size:13px;font-weight:700;color:var(--text);line-height:1.35;margin-bottom:4px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.prod-desc{font-size:11px;color:var(--muted);margin-bottom:8px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;flex:1;}
.prod-pricing{margin-bottom:10px;}
.prod-price{font-size:17px;font-weight:800;color:var(--text);}
.prod-offer-price{font-size:17px;font-weight:800;color:var(--green);}
.prod-old{font-size:11px;color:var(--muted2);text-decoration:line-through;margin-right:4px;}
.prod-save{font-size:10px;font-weight:700;color:var(--red);background:rgba(255,59,48,.1);padding:2px 5px;border-radius:4px;}

.wa-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:var(--wa);color:#fff;border:none;border-radius:9px;
  padding:10px;font-size:13px;font-weight:700;width:100%;
  transition:background .15s;
}
.wa-btn:hover{background:var(--wa-dark);}
.wa-btn svg{width:15px;height:15px;fill:#fff;flex-shrink:0;}
.wa-btn.disabled{background:var(--muted2);pointer-events:none;}

/* ── POSTS FEED ─────────────────────────────── */
.posts-row{
  display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none;
}
.posts-row::-webkit-scrollbar{display:none;}
.post-card{
  flex-shrink:0;width:180px;background:var(--white);border-radius:var(--radius);
  border:1px solid var(--border);overflow:hidden;box-shadow:var(--shadow);
}
.post-card video{width:100%;height:200px;object-fit:cover;display:block;}
.post-card-body{padding:10px;}
.post-card-caption{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.post-card-product{font-size:13px;font-weight:700;margin-bottom:2px;}
.post-card-price{font-size:14px;font-weight:800;color:var(--green);}
/* ── VIDEO LIGHTBOX ─────────────────────────── */
.vbox-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:600;
  display:none;align-items:center;justify-content:center;padding:16px;
  -webkit-overflow-scrolling:touch;
}
.vbox-bg.open{display:flex;}
.vbox{
  position:relative;width:100%;max-width:480px;
  background:#000;border-radius:18px;overflow:hidden;
  animation:slideUp .25s ease;
}
.vbox video{width:100%;max-height:70vh;object-fit:contain;display:block;background:#000;}
.vbox-close{
  position:absolute;top:12px;right:12px;z-index:2;
  background:rgba(0,0,0,.6);border:none;color:#fff;
  width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;
  backdrop-filter:blur(4px);line-height:34px;text-align:center;
}
.vbox-info{padding:16px 18px 20px;background:#111;}
.vbox-product{font-size:15px;font-weight:700;color:#fff;margin-bottom:4px;}
.vbox-price{font-size:18px;font-weight:800;color:#34C759;margin-bottom:6px;}
.vbox-caption{font-size:13px;color:rgba(255,255,255,.65);margin-bottom:14px;line-height:1.5;}
.vbox-wa{
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
  background:#25D366;color:#fff;border:none;border-radius:12px;
  padding:13px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s;
}
.vbox-wa:hover{background:#128C7E;}
.vbox-wa svg{width:18px;height:18px;fill:#fff;flex-shrink:0;}


/* ── EMPTY STATE ───────────────────────────── */
.empty-state{
  grid-column:1/-1;text-align:center;padding:60px 20px;
  color:var(--muted);
}
.empty-icon{font-size:48px;margin-bottom:12px;}
.empty-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:6px;}
.empty-sub{font-size:14px;}

/* ── PRODUCT MODAL ──────────────────────────── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;
  display:none;align-items:flex-end;justify-content:center;
  padding:0;
  -webkit-overflow-scrolling:touch;
}
.modal-bg.open{display:flex;}
@media(min-width:640px){.modal-bg{align-items:center;padding:20px;}}

.modal{
  background:var(--white);border-radius:24px 24px 0 0;
  width:100%;max-width:640px;max-height:92vh;
  overflow-y:auto;animation:slideUp .3s ease;
}
@media(min-width:640px){.modal{border-radius:20px;}}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}

.modal-img-wrap{
  position:relative;background:linear-gradient(135deg,#f0f0f8,#e4e4f0);
  height:260px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:80px;
}
@media(min-width:640px){.modal-img-wrap{height:320px;}}
.modal-img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:16px;}
.modal-img-wrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.modal-close-btn{
  position:absolute;top:12px;right:12px;z-index:2;
  background:rgba(0,0,0,.45);border:none;color:#fff;
  width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;
  backdrop-filter:blur(4px);transition:background .15s;
}
.modal-close-btn:hover{background:rgba(0,0,0,.7);}

.modal-body{padding:20px 20px 32px;}
.modal-badges{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.modal-cat{background:rgba(10,132,255,.1);color:var(--blue);font-size:11px;font-weight:700;padding:4px 10px;border-radius:5px;}
.modal-stock{font-size:11px;font-weight:700;padding:4px 10px;border-radius:5px;}
.modal-stock.in{background:rgba(52,199,89,.1);color:var(--green);}
.modal-stock.limited{background:rgba(255,149,0,.1);color:var(--orange);}
.modal-stock.out{background:rgba(255,59,48,.1);color:var(--red);}
.modal-name{font-size:20px;font-weight:800;line-height:1.3;margin-bottom:6px;}
.modal-desc{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:16px;}

.modal-price-box{
  background:var(--bg);border-radius:12px;padding:14px 16px;
  margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;
}
.modal-price-main{font-size:26px;font-weight:800;color:var(--green);}
.modal-price-was{display:flex;flex-direction:column;align-items:flex-end;}
.modal-price-old{font-size:14px;color:var(--muted2);text-decoration:line-through;}
.modal-price-save{font-size:13px;font-weight:700;color:var(--red);}

.modal-wa-btn{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--wa);color:#fff;border:none;border-radius:14px;
  padding:16px;font-size:16px;font-weight:700;transition:background .15s;
}
.modal-wa-btn:hover{background:var(--wa-dark);}
.modal-wa-btn svg{width:22px;height:22px;fill:#fff;}

/* ── FOOTER ─────────────────────────────────── */
.footer{
  background:#1a1a2e;color:rgba(255,255,255,.6);
  text-align:center;padding:32px 20px;margin-top:48px;
}
.footer-logo{font-size:20px;font-weight:800;color:#fff;margin-bottom:8px;}
.footer-logo span{color:var(--green);}
.footer-tagline{font-size:13px;margin-bottom:16px;}
.footer-wa{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--wa);color:#fff;border:none;border-radius:24px;
  padding:12px 24px;font-size:14px;font-weight:700;transition:background .15s;margin-bottom:20px;
}
.footer-wa:hover{background:var(--wa-dark);}
.footer-copy{font-size:11px;color:rgba(255,255,255,.3);}

/* ── MISC ───────────────────────────────────── */
.no-results{
  grid-column:1/-1;text-align:center;padding:48px 20px;color:var(--muted);
}
.page-bottom-gap{height:32px;}

@media(max-width:480px){
  .header-wa .wa-label{display:none;}
  .topbar{padding:0 12px;gap:8px;}
}
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header class="site-header">
  <div class="topbar">
    <div class="logo">🍎 <span>Breo</span>mobile</div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search iPhone, MacBook, iPad..." oninput="applyFilters()">
    </div>
    <button class="header-wa" id="headerWaBtn" onclick="openWhatsApp(null)">

      <span class="wa-label">WhatsApp</span>
    </button>
  </div>
  <div class="cat-bar">
    <div class="cat-bar-inner" id="catBar">
      <button class="cat-pill active" onclick="setCat('',this)">All</button>
      <button class="cat-pill" onclick="setCat('iPhone',this)">📱 iPhone</button>
      <button class="cat-pill" onclick="setCat('MacBook',this)">💻 MacBook</button>
      <button class="cat-pill" onclick="setCat('iPad',this)">🖥️ iPad</button>
      <button class="cat-pill" onclick="setCat('Apple Watch',this)">⌚ Apple Watch</button>
      <button class="cat-pill" onclick="setCat('AirPods',this)">🎧 AirPods</button>
      <button class="cat-pill" onclick="setCat('Other',this)">📦 Other</button>
    </div>
  </div>
</header>

<!-- ── HERO ── -->
<section class="hero" id="heroSection">
  <div id="heroInner"></div>
</section>

<!-- ── OFFER POSTS FEED ── -->
<div id="postsSection" style="display:none">
  <div class="section">
    <div class="section-head">
      <div class="section-title">🔥 Latest <span>Posts</span></div>
    </div>
    <div class="posts-row" id="postsRow"></div>
  </div>
</div>

<!-- ── HOT OFFERS ── -->
<div id="offersSection" style="display:none">
  <div class="section">
    <div class="section-head">
      <div class="section-title">🎯 Hot <span>Offers</span></div>
    </div>
    <div class="offers-scroll" id="offersRow"></div>
  </div>
</div>

<!-- ── PRODUCTS ── -->
<div class="section">
  <div class="section-head">
    <div class="section-title" id="productsTitle">All <span>Products</span></div>
    <span id="productCount" style="font-size:13px;color:var(--muted)"></span>
  </div>
  <div class="products-grid" id="productsGrid"></div>
</div>

<div class="page-bottom-gap"></div>

<!-- ── FOOTER ── -->
<footer class="footer">
  <div class="footer-logo">🍎 <span>Breo</span>mobile</div>

'use strict';

// ── DATA ──────────────────────────────────────────────────────────────────────
function getProducts(){try{return JSON.parse(localStorage.getItem('breo_products')||'[]');}catch(e){return[];}}
function getPosts(){try{return JSON.parse(localStorage.getItem('breo_posts')||'[]');}catch(e){return[];}}
function getSettings(){try{return JSON.parse(localStorage.getItem('breo_settings')||'{}');}catch(e){return {};}}

function getWaNumber(){
  const s=getSettings();
  const num=(s.waNumber||localStorage.getItem('breo_wa')||'').replace(/\D/g,'');
  return num;
}

// ── INDEXED DB ────────────────────────────────────────────────────────────────
const DB={
  _db:null,
  open(){
    if(this._db)return Promise.resolve(this._db);
    return new Promise((res,rej)=>{
      const req=indexedDB.open('breo-media',2);
      req.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('media'))db.createObjectStore('media');
        if(!db.objectStoreNames.contains('videos'))db.createObjectStore('videos');
      };
      req.onsuccess=e=>{this._db=e.target.result;res(this._db);};
      req.onerror=()=>res(null);
    });
  },
  async get(id){
    try{
      const db=await this.open();
      if(!db)return null;
      return new Promise((res)=>{
        const tx=db.transaction('media','readonly');
        const r=tx.objectStore('media').get(id);
        r.onsuccess=e=>res(e.target.result||null);
        r.onerror=()=>res(null);
      });
    }catch(e){return null;}
  }
};

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentCat='';
let currentSearch='';
let currentProduct=null;
let heroTimer=null;
let heroIndex=0;

function getCatEmoji(cat){
  return{iPhone:'📱',MacBook:'💻',iPad:'🖥️','Apple Watch':'⌚',AirPods:'🎧'}[cat]||'📦';
}

function calcSavings(price,offerPrice){
  if(!offerPrice||offerPrice>=price)return 0;
  return Math.round((1-offerPrice/price)*100);
}

// ── WHATSAPP ──────────────────────────────────────────────────────────────────
function openWhatsApp(product){
  const num=getWaNumber();
  if(!num){alert('WhatsApp not configured yet. Please contact the store.');return;}
  let msg;
  if(product){
    const price=Number(product.offerPrice||product.price||0).toLocaleString();
    msg=`Hi BreoMobile! I'm interested in the *${product.name}* — AED ${price}. Can you help me with availability and delivery?`;
  }else{
    msg='Hi BreoMobile! I want to browse your products. Can you help me?';
  }
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg),'_blank');
}

  // Build carousel

            ${s.caption?`<p>${s.caption.slice(0,80)}</p>`:''}
            <button class="hero-cta" onclick="openWhatsApp(null)">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.004 2c-5.523 0-10 4.477-10 10 0 1.762.461 3.417 1.27 4.853L2 22l5.306-1.253A9.956 9.956 0 0012.004 22c5.523 0 10-4.477 10-10s-4.477-10-10-10z"/></svg>
              Enquire Now

function goToSlide(idx){
  heroIndex=idx;

// ── OFFERS ROW ────────────────────────────────────────────────────────────────
async function buildOffers(){
  const offers=getProducts().filter(p=>p.published&&p.isOffer);
  const section=document.getElementById('offersSection');
  if(!offers.length){section.style.display='none';return;}
  section.style.display='block';
  const row=document.getElementById('offersRow');
  row.innerHTML=offers.map(o=>{
    const savings=calcSavings(o.price,o.offerPrice);
    return`<div class="offer-card" onclick="openProductModal('${o.id}')">
      <div class="offer-card-img" id="oimg-${o.id}">

        <div class="offer-card-name">${o.name}</div>

    el.style.backgroundSize='cover';

    el.querySelector('span').style.display='none';

}

// ── POSTS ROW ─────────────────────────────────────────────────────────────────
async function buildPosts(){
  const posts=getPosts();
  const section=document.getElementById('postsSection');
  if(!posts.length){section.style.display='none';return;}

  for(const post of posts){

    const blob=await DB.get(post.id);

// ── PRODUCTS GRID ─────────────────────────────────────────────────────────────

        <button class="wa-btn${stockOut?' disabled':''}" onclick="event.stopPropagation();openWhatsApp(${JSON.stringify({id:p.id,name:p.name,price:p.price,offerPrice:p.offerPrice}).replace(/"/g,'&quot;')})">
          <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.004 2c-5.523 0-10 4.477-10 10 0 1.762.461 3.417 1.27 4.853L2 22l5.306-1.253A9.956 9.956 0 0012.004 22c5.523 0 10-4.477 10-10s-4.477-10-10-10z"/></svg>

async function loadGridImages(prods){
  for(const p of prods){
    if(!p.imageId)continue;
    const blob=await DB.get(p.imageId);
    if(!blob)continue;
    const el=document.getElementById('pimg-'+p.id);

    el.innerHTML=`<img src="${url}" alt="${p.name}" loading="lazy">

      ${calcSavings(p.price,p.offerPrice)?`<span class="sale-badge">-${calcSavings(p.price,p.offerPrice)}%</span>`:''}

}

// ── PRODUCT MODAL ─────────────────────────────────────────────────────────────
async function openProductModal(id){
  const p=getProducts().find(x=>x.id===id);
  if(!p)return;
  currentProduct=p;

  const wrap=document.getElementById('modalImgWrap');
  const emoji=document.getElementById('modalImgEmoji');

  // Reset image area
  wrap.querySelectorAll('img,video').forEach(el=>el.remove());
  if(emoji)emoji.style.display='block';
  emoji.textContent=getCatEmoji(p.category);

  // Load image
  if(p.imageId){
    const blob=await DB.get(p.imageId);
    if(blob){
      const img=document.createElement('img');
      img.src=URL.createObjectURL(blob);
      img.alt=p.name;
      wrap.appendChild(img);
      if(emoji)emoji.style.display='none';
    }
  }

  // Load video (overlays image if exists)
  if(p.videoId){
    const vblob=await DB.get(p.videoId);
    if(vblob){
      const vid=document.createElement('video');
      vid.src=URL.createObjectURL(vblob);
      vid.controls=true;vid.muted=true;vid.loop=true;vid.playsInline=true;
      vid.autoplay=true;
      wrap.appendChild(vid);
      if(emoji)emoji.style.display='none';
    }
  }

  // Fill text
  document.getElementById('modalName').textContent=p.name||'Product';
  document.getElementById('modalDesc').textContent=p.description||'';
  document.getElementById('modalDesc').style.display=p.description?'block':'none';
  document.getElementById('modalCat').textContent=p.category||'';

  const stockEl=document.getElementById('modalStock');
  const stockMap={in_stock:'In Stock',limited:'Limited Stock',out_of_stock:'Out of Stock'};
  const stockClass={in_stock:'in',limited:'limited',out_of_stock:'out'};
  stockEl.textContent=stockMap[p.stock]||'In Stock';
  stockEl.className='modal-stock '+(stockClass[p.stock]||'in');

  // Pricing
  const savings=calcSavings(p.price,p.offerPrice);
  if(p.offerPrice&&savings>0){
    document.getElementById('modalPrice').textContent='AED '+Number(p.offerPrice).toLocaleString();
    document.getElementById('modalPriceWas').style.display='flex';
    document.getElementById('modalPriceOld').textContent='Was AED '+Number(p.price).toLocaleString();
    document.getElementById('modalPriceSave').textContent='You save '+savings+'% 🎉';
  }else{
    document.getElementById('modalPrice').textContent='AED '+Number(p.price||0).toLocaleString();
    document.getElementById('modalPriceWas').style.display='none';
  }

  const waBtn=document.getElementById('modalWaBtn');
  if(p.stock==='out_of_stock'){
    waBtn.textContent='Currently Out of Stock';
    waBtn.style.background='#999';
    waBtn.style.pointerEvents='none';
  }else{
    waBtn.innerHTML=`<svg viewBox="0 0 24 24" width="22" height="22" fill="#fff"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.004 2c-5.523 0-10 4.477-10 10 0 1.762.461 3.417 1.27 4.853L2 22l5.306-1.253A9.956 9.956 0 0012.004 22c5.523 0 10-4.477 10-10s-4.477-10-10-10z"/></svg> Enquire on WhatsApp`;
    waBtn.style.background='';waBtn.style.pointerEvents='';
  }

  document.getElementById('modalBg').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
  document.body.style.overflow='';
  currentProduct=null;
  // pause any playing videos
  document.querySelectorAll('#productModal video').forEach(v=>{v.pause();v.src='';});
}

// close on escape
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});


// ── VIDEO LIGHTBOX ────────────────────────────────────────────────────────────
let vboxCurrentPost=null;

function openVbox(post,blobUrl){
  vboxCurrentPost=post;
  const vid=document.getElementById('vboxVideo');
  vid.src=blobUrl;
  vid.play().catch(()=>{});

  const prodEl=document.getElementById('vboxProduct');
  const priceEl=document.getElementById('vboxPrice');
  const capEl=document.getElementById('vboxCaption');

  if(post.product){prodEl.textContent=post.product;prodEl.style.display='block';}else{prodEl.style.display='none';}
  if(post.price){priceEl.textContent='AED '+Number(post.price).toLocaleString();priceEl.style.display='block';}else{priceEl.style.display='none';}
  const capText=[post.caption,post.hashtags].filter(Boolean).join(' ');
  if(capText){capEl.textContent=capText;capEl.style.display='block';}else{capEl.style.display='none';}

  document.getElementById('vboxBg').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeVbox(){
  document.getElementById('vboxBg').classList.remove('open');
  const vid=document.getElementById('vboxVideo');
  vid.pause();vid.src='';
  document.body.style.overflow='';
  vboxCurrentPost=null;
}

// ── INIT ──────────────────────────────────────────────────────────────────────
async function init(){
  buildHero();
  buildOffers();
  buildPosts();
  renderProductGrid();
}

window.addEventListener('DOMContentLoaded',init);
</script>
